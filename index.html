<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="다음, 구글, 네이버, 크리에이터 어드바이저 실시간 검색어">
  <title>실시간 인기 검색어</title>
  <style>
    :root{--navy:#06295f;--bg:#f7f8fa;--muted:#929292}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#111;font-family:Arial,"Malgun Gothic",sans-serif}
    button,select,input{font:inherit}button{cursor:pointer}
    .keyword-search{display:grid;grid-template-columns:minmax(0,1fr) auto;width:min(680px,calc(100% - 28px));margin:16px auto 8px;overflow:hidden;border:2px solid var(--navy);border-radius:10px;background:#fff;box-shadow:0 5px 18px rgba(20,53,91,.1)}.keyword-search label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.keyword-search input{min-width:0;height:50px;padding:0 17px;border:0;outline:0;background:transparent;color:#142033;font-size:16px;font-weight:750}.keyword-search input::placeholder{color:#8b96a5;font-weight:650}.keyword-search button{min-width:74px;border:0;background:var(--navy);color:#fff;font-size:14px;font-weight:900}.keyword-search:focus-within{box-shadow:0 0 0 4px rgba(6,41,95,.12),0 5px 18px rgba(20,53,91,.1)}
    .dashboard-layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,24vw,390px);gap:clamp(16px,1.6vw,28px);align-items:start;width:100%;padding:24px 2vw 50px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.4vw,26px);width:100%;max-width:100%;margin:0 auto;align-items:start}
    .card{width:100%;max-width:100%;min-width:0;overflow:hidden;padding:34px 22px 28px;border:1px solid #e3eaf2;border-radius:9px;background:#fff;box-shadow:0 5px 20px rgba(43,81,120,.11)}
    .card-head{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:0 36px;border:0;background:transparent}.collapse-icon{position:absolute;top:50%;right:4px;color:#718096;font-size:22px;font-weight:900;line-height:1;transform:translateY(-50%);transition:transform .18s ease}.card.collapsed{padding-bottom:34px}.card.collapsed .card-body{display:none}.card.collapsed .collapse-icon{transform:translateY(-50%) rotate(180deg)}.logo{display:grid;place-items:center;width:31px;height:31px;flex:0 0 auto;border-radius:50%;color:#fff;font-weight:950}
    [data-portal=daum] .logo{border-radius:4px;background:linear-gradient(135deg,#ffbf00,#4e8cff,#f15c5c)}[data-portal=google] .logo{background:conic-gradient(#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 72%,#ea4335 0)}[data-portal=naver] .logo{background:#13c965}[data-portal=signal] .logo{background:#03c75a;color:#fff}
    h2{max-width:100%;margin:0;color:var(--navy);font-size:clamp(18px,1.35vw,27px);font-weight:950;letter-spacing:-2px;text-align:center;overflow-wrap:anywhere;word-break:keep-all}.date{margin:23px 0 18px;color:var(--muted);text-align:center;font-size:14px;font-weight:800}
    .collection-groups{display:grid;gap:18px}.collection-group h3{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 4px;padding:8px 10px;border-radius:6px;background:#eef3f8;color:var(--navy);font-size:12px;font-weight:900}.collection-group h3 small{color:#76869a;font-size:10px}
    ol{list-style:none;margin:0;padding:0}.keyword-entry{display:block}.keyword-row{display:flex;align-items:flex-start;min-height:54px;padding:7px 0}.rank{display:grid;place-items:center;width:40px;height:40px;flex:0 0 auto;border-radius:5px;color:white;font-size:18px;font-weight:900}
    [data-portal=daum] .rank{background:#ffb70a}[data-portal=google] .rank{background:#4285ed}[data-portal=naver] .rank{background:#2cad59}[data-portal=signal] .rank{background:#03c75a}
    .keyword-row a{max-width:100%;min-width:0;flex:1;margin-left:24px;padding:7px 0;color:#070707;text-decoration:none;line-height:1.45;overflow-wrap:anywhere;word-break:keep-all;font-size:18px;font-weight:850;letter-spacing:-1px}.keyword-row a:hover{color:#315eaa;text-decoration:underline}
    .related-toggle{display:grid;place-items:center;width:22px;height:22px;margin:9px 10px 0 0;flex:0 0 auto;border:2px solid #cbd3dd;border-radius:5px;background:#fff;color:#fff;font-size:15px;font-weight:950;line-height:1}.related-toggle:hover{border-color:#6682a7;background:#f2f6fb}.related-toggle.checked{border-color:var(--navy);background:var(--navy)}
    .remove{width:32px;height:32px;margin-top:4px;border:0;border-radius:50%;background:transparent;color:#c0c5cc;font-size:22px;opacity:0}.keyword-row:hover .remove,.remove:focus{opacity:1}.remove:hover{background:#ef5350;color:white}
    .related-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--navy);font-size:14px}.related-head>div{display:grid;min-width:0;gap:3px}.related-head>div span{color:#7a8798;font-size:11px;font-weight:800}.related-head>div strong{max-width:100%;overflow-wrap:anywhere;word-break:keep-all}.related-head button{padding:6px 9px;border:1px solid #cbd9e9;border-radius:5px;background:#fff;color:var(--navy);font-size:11px;font-weight:850}.related-head button:hover{border-color:var(--navy);background:var(--navy);color:#fff}.related-head button:disabled{opacity:.45;cursor:default}
    .related-list{list-style:none;margin:11px 0 0;padding:0}.related-list li{display:flex;align-items:center;min-height:32px;padding:3px 0;border-top:1px solid #e9eef4}.copy-keyword{min-width:0;flex:1;padding:2px 0;border:0;background:none;color:#18212c;text-align:left;line-height:1.45;overflow-wrap:anywhere;word-break:keep-all;font-size:13px;font-weight:750}.copy-keyword:hover{color:#315eaa;text-decoration:underline}.related-status{margin:12px 0 1px;color:#77808b;font-size:12px}.related-status.error{color:#b63731}
    .related-drawer{position:sticky;top:0;display:flex;flex-direction:column;width:100%;height:100vh;max-height:100vh;max-width:100%;min-width:0;overflow:hidden;border:1px solid #cfd9e6;border-radius:12px;background:#fff;box-shadow:0 8px 28px rgba(15,40,72,.14)}.related-mobile-backdrop{display:none}.related-placeholder{display:grid;place-content:center;min-height:100%;padding:36px 28px;color:#778394;text-align:center}.related-placeholder strong{color:var(--navy);font-size:20px}.related-placeholder p{max-width:260px;margin:12px auto 0;font-size:13px;line-height:1.7}.related-drawer-title{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid #dfe7f0;background:var(--navy);color:#fff}.related-drawer-title>div{display:grid;min-width:0;gap:4px}.related-drawer-title span{color:#c7d8ee;font-size:11px;font-weight:800}.related-drawer-title strong{max-width:100%;overflow-wrap:anywhere;word-break:keep-all}.related-drawer-title>button{width:36px;height:36px;flex:0 0 auto;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(255,255,255,.08);color:#fff;font-size:24px}.related-drawer>.related-status{margin:24px}.related-drawer-sections{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);min-height:0;flex:1}.related-result-section{min-height:0;overflow:auto;padding:17px 20px}.related-result-section+.related-result-section{border-top:4px solid #e7edf4}
    .empty{grid-column:1/-1;padding:70px;text-align:center;color:#888}.rank-empty{margin:18px 0 0;padding:22px 12px;border-radius:7px;background:#f5f8fb;color:#7b8795;text-align:center;font-size:12px;line-height:1.6}.source{margin:16px 0 0;color:#aaa;text-align:center;font-size:11px}
    .delete-overlay[hidden]{display:none}.delete-overlay{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:20px;background:rgba(9,25,46,.48);backdrop-filter:blur(3px)}.delete-dialog{width:min(400px,100%);padding:28px;border-radius:12px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.24)}.delete-dialog h2{margin:0;font-size:22px}.delete-dialog p{margin:12px 0 20px;color:#606975;font-size:14px;line-height:1.55}.delete-dialog label{display:block;margin-bottom:7px;color:#303947;font-size:13px;font-weight:850}.delete-dialog input{width:100%;height:44px;padding:0 12px;border:1px solid #cbd5e1;border-radius:7px;outline:none}.delete-dialog input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(6,41,95,.1)}.delete-error{min-height:18px;margin:7px 0 0!important;color:#c53631!important;font-size:12px!important;font-weight:800}.delete-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.delete-actions button{height:40px;padding:0 16px;border:1px solid #d7dee8;border-radius:7px;background:#fff;color:#475466;font-weight:850}.delete-actions .danger{border-color:#df453f;background:#df453f;color:#fff}
    @media(max-width:1500px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:1100px){main{grid-template-columns:1fr;max-width:560px}}@media(max-width:820px){.dashboard-layout{grid-template-columns:1fr}main{max-width:520px}.related-mobile-backdrop.open{position:fixed;z-index:69;inset:0;display:block;border:0;background:rgba(7,22,43,.42);backdrop-filter:blur(2px)}.related-drawer{position:fixed;z-index:70;top:max(12px,env(safe-area-inset-top));right:10px;bottom:max(12px,env(safe-area-inset-bottom));width:min(390px,calc(100vw - 28px));height:auto;max-height:calc(100dvh - 24px);transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none;transition:transform .22s ease,opacity .18s ease}.related-drawer.open{transform:translateX(0);opacity:1;pointer-events:auto}}@media(max-width:700px){.keyword-search{margin-bottom:0}.keyword-search input{height:48px;padding:0 13px;font-size:15px}.keyword-search button{min-width:64px}.dashboard-layout{padding:16px 14px 40px}.card{padding:34px 25px}h2{font-size:23px}.keyword-row a{margin-left:14px;font-size:17px}.related-toggle{margin-right:8px}.remove{opacity:1}}
  </style>
</head>
<body>
  <form class="keyword-search" id="keyword-search-form">
    <label for="keyword-search-input">연관 검색어 검색</label>
    <input id="keyword-search-input" type="search" placeholder="키워드를 입력하고 엔터를 누르세요" autocomplete="off">
    <button type="submit">검색</button>
  </form>
  <div class="dashboard-layout">
    <main id="grid"><div class="empty">검색어를 불러오는 중입니다.</div></main>
    <button type="button" class="related-mobile-backdrop" id="related-backdrop" aria-label="연관 검색어 닫기"></button>
    <aside class="related-drawer" id="related-drawer" aria-live="polite">
      <div class="related-placeholder"><strong>연관 검색어</strong><p>상단에 키워드를 입력하거나 왼쪽 체크 버튼을 누르면 연관 검색어가 표시됩니다.</p></div>
    </aside>
  </div>
  <div class="delete-overlay" id="delete-modal" hidden>
    <form class="delete-dialog" id="delete-form">
      <h2>키워드 삭제</h2>
      <p><strong id="delete-keyword"></strong>을 삭제하면 이후 수집에서도 제외됩니다.</p>
      <label for="delete-password">삭제 비밀번호</label>
      <input id="delete-password" type="password" autocomplete="current-password" required>
      <p class="delete-error" id="delete-error"></p>
      <div class="delete-actions">
        <button type="button" id="delete-cancel">취소</button>
        <button type="submit" class="danger">삭제</button>
      </div>
    </form>
  </div>
  <script>
    const META={
      daum:{portalId:"daum",title:"다음 실시간 검색어",mark:"D"},
      google:{portalId:"google",title:"구글 실시간 검색어",mark:"G"},
      naver:{portalId:"naver",title:"크리에이터 어드바이저 검색어",mark:"C"},
      signal:{portalId:"signal",title:"네이버 실시간 검색어",mark:"N"},
      daumMore:{portalId:"daum",title:"다음 추가 실시간 순위",mark:"D"},
      googleMore:{portalId:"google",title:"구글 추가 실시간 순위",mark:"G"}
    };
    const VIEW_ORDER=["daum","google","signal","naver","daumMore","googleMore"];
    const grid=document.getElementById("grid");
    const relatedDrawer=document.getElementById("related-drawer");
    const relatedBackdrop=document.getElementById("related-backdrop");
    const keywordSearchForm=document.getElementById("keyword-search-form");
    const keywordSearchInput=document.getElementById("keyword-search-input");
    const deleteModal=document.getElementById("delete-modal");
    const deletePassword=document.getElementById("delete-password");
    const deleteError=document.getElementById("delete-error");
    let pendingDelete=null;
    let staticRelated={};
    let activeRelatedId="";
    let activeRelatedResult=null;
    const LOCAL_DISMISSED_STORAGE="trend-now-dismissed-keywords";
    const LOCAL_DELETE_PASSWORD_HASH="5feceb66ffc86f38d952786c6d696c79c2dbc239dd4e91b46729d73a27fb57e9";
    const escapeHtml=value=>{const node=document.createElement("span");node.textContent=value;return node.innerHTML};
    const escapeAttr=value=>escapeHtml(value).replace(/"/g,"&quot;");
    const localKeywordKey=value=>String(value||"").normalize("NFKC").toLocaleLowerCase("ko-KR").replace(/[^\p{L}\p{N}]+/gu,"");
    const readLocalDismissed=()=>{
      try{return new Set(JSON.parse(localStorage.getItem(LOCAL_DISMISSED_STORAGE)||"[]"))}catch{return new Set()}
    };
    const localDismissed=readLocalDismissed();
    const saveLocalDismissed=()=>{
      try{localStorage.setItem(LOCAL_DISMISSED_STORAGE,JSON.stringify([...localDismissed]))}catch{}
    };
    const verifyLocalDeletePassword=async value=>{
      const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));
      const hash=[...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,"0")).join("");
      return hash===LOCAL_DELETE_PASSWORD_HASH;
    };
    const date=value=>new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(value));
    const collectedDate=value=>new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(value));
    const groupedItems=items=>{
      const groups=new Map();
      items.forEach(item=>{const label=collectedDate(item.firstSeenAt);const group=groups.get(label)||[];group.push(item);groups.set(label,group)});
      return [...groups.entries()];
    };
    const portalViews=portals=>{
      const byId=new Map(portals.map(portal=>[portal.id,portal]));
      return VIEW_ORDER.map(viewId=>{
        const meta=META[viewId],portal=byId.get(meta.portalId),allItems=(portal?.items||[]).filter(item=>!localDismissed.has(localKeywordKey(item.keyword)));
        const items=viewId==="daumMore"||viewId==="googleMore"?allItems.slice(10):viewId==="daum"||viewId==="google"?allItems.slice(0,10):allItems;
        return{viewId,...meta,items};
      });
    };
    async function copyText(value){
      if(navigator.clipboard?.writeText){
        try{await navigator.clipboard.writeText(value);return}catch{}
      }
      const textarea=document.createElement("textarea");textarea.value=value;textarea.style.cssText="position:fixed;opacity:0";
      document.body.appendChild(textarea);textarea.select();document.execCommand("copy");textarea.remove();
    }
    const dedupeItems=items=>{
      const seen=new Set();
      return (Array.isArray(items)?items:[]).filter(item=>{
        const key=String(item?.keyword||"").normalize("NFKC").toLocaleLowerCase("ko-KR").replace(/[^\p{L}\p{N}]+/gu,"");
        if(!key||seen.has(key))return false;
        seen.add(key);return true;
      });
    };
    const normalizeRelated=(value,seed)=>{
      if(Array.isArray(value))return{seed,prefix:"",fullItems:dedupeItems(value),prefixItems:[]};
      const fullItems=dedupeItems(value?.fullItems||value?.items||[]);
      const fullKeys=new Set(fullItems.map(item=>String(item.keyword).normalize("NFKC").toLocaleLowerCase("ko-KR").replace(/[^\p{L}\p{N}]+/gu,"")));
      const prefixItems=dedupeItems(value?.prefixItems||[]).filter(item=>{
        const key=String(item.keyword).normalize("NFKC").toLocaleLowerCase("ko-KR").replace(/[^\p{L}\p{N}]+/gu,"");
        return key&&!fullKeys.has(key);
      });
      return{seed:value?.seed||seed,prefix:value?.prefix||"",fullItems,prefixItems};
    };
    const relatedSection=(label,query,items,section)=>`<section class="related-result-section">
      <div class="related-head"><div><span>${label}</span><strong>${escapeHtml(query||"추가 검색 없음")}</strong></div><button class="copy-section" data-section="${section}" ${items.length?"":"disabled"}>복사 (${items.length})</button></div>
      ${items.length?`<ul class="related-list">${items.map(item=>`<li><button class="copy-keyword" title="클릭해서 이 검색어 복사">${escapeHtml(item.keyword)}</button></li>`).join("")}</ul>`:`<p class="related-status">${section==="prefix"?"여러 단어 검색어에서 첫 단어 결과를 표시합니다.":"표시할 연관 검색어가 없습니다."}</p>`}
    </section>`;
    function renderRelatedDrawer(result){
      activeRelatedResult=result;
      relatedDrawer.innerHTML=`<div class="related-drawer-title"><div><span>선택한 검색어</span><strong>${escapeHtml(result.seed)}</strong></div><button class="close-related" aria-label="연관 검색어 닫기">×</button></div>
        <div class="related-drawer-sections">${relatedSection("전체 문구",result.seed,result.fullItems,"full")}${relatedSection("첫 단어",result.prefix,result.prefixItems,"prefix")}</div>`;
    }
    function closeRelatedDrawer(){
      relatedDrawer.innerHTML='<div class="related-placeholder"><strong>연관 검색어</strong><p>상단에 키워드를 입력하거나 왼쪽 체크 버튼을 누르면 연관 검색어가 표시됩니다.</p></div>';activeRelatedId="";activeRelatedResult=null;
      relatedDrawer.classList.remove("open");relatedBackdrop.classList.remove("open");
      grid.querySelectorAll(".related-toggle.checked").forEach(button=>{button.classList.remove("checked");button.setAttribute("aria-checked","false");button.querySelector("span").textContent=""});
    }

    async function fetchBrowserRelated(seed){
      const fetchDaum=async query=>{
        const url=new URL("https://suggest.search.daum.net/sushi/opensearch/pc");
        url.searchParams.set("q",query);url.searchParams.set("DA","JU2");
        const response=await fetch(url);
        if(!response.ok)throw new Error();
        const data=await response.json();
        return (Array.isArray(data[1])?data[1]:[]).map(keyword=>({keyword,sources:["daum"]}));
      };
      const prefix=seed.split(/\s+/)[0]||"";
      const [fullItems,prefixItems]=await Promise.all([
        fetchDaum(seed),
        prefix&&prefix!==seed?fetchDaum(prefix):Promise.resolve([])
      ]);
      return normalizeRelated({seed,prefix,fullItems,prefixItems},seed);
    }

    async function openRelatedSearch(requestId,keyword,fallback){
      activeRelatedId=requestId;
      relatedDrawer.classList.add("open");relatedBackdrop.classList.add("open");
      relatedDrawer.innerHTML=`<div class="related-drawer-title"><div><span>선택한 검색어</span><strong>${escapeHtml(keyword)}</strong></div><button class="close-related" aria-label="연관 검색어 닫기">×</button></div><p class="related-status">네이버·다음·구글에서 찾는 중…</p>`;
      try{
        let result;
        const response=await fetch(`/api/related?q=${encodeURIComponent(keyword)}`);
        if(response.ok){
          result=normalizeRelated(await response.json(),keyword);
        }else if(fallback){
          result=normalizeRelated(fallback,keyword);
        }else{
          result=await fetchBrowserRelated(keyword);
        }
        if(activeRelatedId===requestId)renderRelatedDrawer(result);
      }catch{
        if(activeRelatedId===requestId)relatedDrawer.innerHTML=`<div class="related-drawer-title"><div><span>선택한 검색어</span><strong>${escapeHtml(keyword)}</strong></div><button class="close-related" aria-label="연관 검색어 닫기">×</button></div><p class="related-status error">연관 검색어를 불러오지 못했습니다.</p>`;
      }
    }

    async function load(){
      try{
        let response=await fetch("/api/trends",{cache:"no-store"});
        if(!response.ok)response=await fetch(`./data/trends.json?t=${Date.now()}`,{cache:"no-store"});
        if(!response.ok)throw new Error();
        const data=await response.json();staticRelated=data.related||{};render(data.portals,data.updatedAt);
      }catch{
        grid.innerHTML='<div class="empty">수집된 키워드를 불러오고 있습니다.</div>';
      }
    }

    function render(portals,updatedAt){
      closeRelatedDrawer();
      grid.innerHTML=portalViews(portals).map(view=>`<section class="card" data-portal="${view.portalId}">
        <button type="button" class="card-head card-title-toggle" aria-expanded="true" aria-label="${escapeAttr(view.title)} 접기"><span class="logo">${view.mark}</span><h2>${view.title}</h2><span class="collapse-icon" aria-hidden="true">⌃</span></button>
        <div class="card-body">
        <p class="date">실시간 순위 ${view.items.length}개 · ${date(updatedAt)} 확인</p>
        <div class="collection-groups">${view.items.length?"":'<p class="rank-empty">새 실시간 순위가 수집되면 이 칸에 표시됩니다.</p>'}${groupedItems(view.items).map(([collectedAt,items])=>`<section class="collection-group"><h3><span>${collectedAt} 수집</span><small>${items.length}개</small></h3><ol>${items.map(item=>`<li class="keyword-entry"><div class="keyword-row"><button class="related-toggle" role="checkbox" aria-checked="false" data-id="${item.id}" data-keyword="${escapeAttr(item.keyword)}" aria-label="${escapeAttr(item.keyword)} 연관 검색어 보기" title="네이버·다음·구글 연관 검색어 보기"><span></span></button><span class="rank">${item.rank}</span><a href="${item.link}" target="_blank" rel="noreferrer">${escapeHtml(item.keyword)}</a><button class="remove" data-id="${item.id}" data-keyword="${escapeAttr(item.keyword)}" aria-label="${escapeAttr(item.keyword)} 삭제">×</button></div></li>`).join("")}</ol></section>`).join("")}</div>
        </div>
      </section>`).join("");
    }

    grid.addEventListener("click",async event=>{
      const cardToggle=event.target.closest(".card-title-toggle");
      if(cardToggle){
        const card=cardToggle.closest(".card");
        const collapsed=card.classList.toggle("collapsed");
        cardToggle.setAttribute("aria-expanded",String(!collapsed));
        cardToggle.setAttribute("aria-label",`${cardToggle.querySelector("h2").textContent} ${collapsed?"펼치기":"접기"}`);
        return;
      }

      const removeButton=event.target.closest(".remove");
      if(removeButton){
        pendingDelete={id:Number(removeButton.dataset.id),keyword:removeButton.dataset.keyword,entry:removeButton.closest(".keyword-entry")};
        document.getElementById("delete-keyword").textContent=removeButton.dataset.keyword;
        deletePassword.value="";deleteError.textContent="";deleteModal.hidden=false;deletePassword.focus();
        return;
      }

      const toggle=event.target.closest(".related-toggle");
      if(toggle){
        const requestId=String(toggle.dataset.id);
        if(activeRelatedId===requestId){
          closeRelatedDrawer();
          return;
        }
        closeRelatedDrawer();
        toggle.classList.add("checked");toggle.setAttribute("aria-checked","true");toggle.querySelector("span").textContent="✓";
        await openRelatedSearch(requestId,toggle.dataset.keyword,staticRelated[toggle.dataset.id]);
        return;
      }
    });
    keywordSearchForm.addEventListener("submit",async event=>{
      event.preventDefault();
      const keyword=keywordSearchInput.value.replace(/\s+/g," ").trim();
      if(!keyword)return;
      closeRelatedDrawer();
      await openRelatedSearch(`manual-${keyword.normalize("NFKC").toLocaleLowerCase("ko-KR")}`,keyword,null);
    });
    relatedDrawer.addEventListener("click",async event=>{
      if(event.target.closest(".close-related")){closeRelatedDrawer();return}
      const copySection=event.target.closest(".copy-section");
      if(copySection&&activeRelatedResult){
        const items=copySection.dataset.section==="prefix"?activeRelatedResult.prefixItems:activeRelatedResult.fullItems;
        await copyText(items.map(item=>item.keyword).join("\n"));
        const original=`복사 (${items.length})`;copySection.textContent="복사됨 ✓";
        setTimeout(()=>copySection.textContent=original,1600);return;
      }
      const copyKeyword=event.target.closest(".copy-keyword");
      if(copyKeyword){
        await copyText(copyKeyword.textContent);
        const original=copyKeyword.textContent;copyKeyword.textContent="복사됨 ✓";
        setTimeout(()=>copyKeyword.textContent=original,1000);
      }
    });
    document.getElementById("delete-form").addEventListener("submit",async event=>{
      event.preventDefault();
      if(!pendingDelete)return;
      const submit=event.currentTarget.querySelector('[type="submit"]');submit.disabled=true;deleteError.textContent="";
      try{
        let deletedFromServer=false;
        try{
          const response=await fetch("/api/trends",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:pendingDelete.id,password:deletePassword.value})});
          const result=await response.json().catch(()=>({}));
          if(response.ok)deletedFromServer=true;
          else if(response.status===401)throw new Error(result.error||"비밀번호가 올바르지 않습니다.");
        }catch(error){
          if(error instanceof Error&&error.message.includes("비밀번호"))throw error;
        }
        if(!deletedFromServer){
          if(!await verifyLocalDeletePassword(deletePassword.value))throw new Error("비밀번호가 올바르지 않습니다.");
          localDismissed.add(localKeywordKey(pendingDelete.keyword));saveLocalDismissed();
        }
        if(activeRelatedId===String(pendingDelete.id))closeRelatedDrawer();
        pendingDelete.entry.remove();deleteModal.hidden=true;pendingDelete=null;
      }catch(error){
        deleteError.textContent=error.message;deletePassword.select();
      }finally{submit.disabled=false}
    });
    const closeDelete=()=>{deleteModal.hidden=true;pendingDelete=null;deletePassword.value="";deleteError.textContent=""};
    document.getElementById("delete-cancel").onclick=closeDelete;
    deleteModal.addEventListener("mousedown",event=>{if(event.target===deleteModal)closeDelete()});
    relatedBackdrop.onclick=closeRelatedDrawer;
    load();
    setInterval(load,60*60*1000);
  </script>
</body>
</html>
