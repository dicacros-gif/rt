<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="다음, 구글, 크리에이터 어드바이저, Signal.bz 실시간 검색어">
  <title>실시간 인기 검색어</title>
  <style>
    :root{--navy:#06295f;--bg:#f7f8fa;--muted:#929292}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#111;font-family:Arial,"Malgun Gothic",sans-serif}
    button,select,input{font:inherit}button{cursor:pointer}
    header{min-height:230px;padding:55px 20px 35px;text-align:center}
    h1{margin:9px 0 25px;font-size:clamp(36px,5vw,58px);letter-spacing:-3px}
    .actions{display:flex;justify-content:center;gap:10px}.actions button,.actions select{height:40px;border:1px solid #dce2ea;border-radius:7px;background:white;color:var(--navy);font-weight:800}.actions button{padding:0 15px}.actions select{padding:0 12px}
    main{display:grid;grid-template-columns:repeat(4,minmax(280px,1fr));gap:38px;max-width:1860px;margin:0 auto;padding:0 4vw 50px;align-items:start}
    .card{padding:42px 38px 30px;border:1px solid #e3eaf2;border-radius:9px;background:#fff;box-shadow:0 5px 20px rgba(43,81,120,.11)}
    .card-head{display:flex;align-items:center;justify-content:center;gap:10px}.logo{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;color:#fff;font-weight:950}
    [data-portal=daum] .logo{border-radius:4px;background:linear-gradient(135deg,#ffbf00,#4e8cff,#f15c5c)}[data-portal=google] .logo{background:conic-gradient(#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 72%,#ea4335 0)}[data-portal=naver] .logo{background:#13c965}[data-portal=signal] .logo{background:#34d499;color:#083e31}
    h2{margin:0;color:var(--navy);font-size:clamp(21px,1.55vw,30px);font-weight:950;letter-spacing:-2px;white-space:nowrap}.date{margin:23px 0 18px;color:var(--muted);text-align:center;font-size:14px;font-weight:800}
    ol{list-style:none;margin:0;padding:0}li{display:flex;align-items:center;min-height:54px}.rank{display:grid;place-items:center;width:40px;height:40px;flex:0 0 auto;border-radius:5px;color:white;font-size:18px;font-weight:900}
    [data-portal=daum] .rank{background:#ffb70a}[data-portal=google] .rank{background:#4285ed}[data-portal=naver] .rank{background:#2cad59}[data-portal=signal] .rank{background:#26b993}
    li a{min-width:0;flex:1;margin-left:24px;overflow:hidden;color:#070707;text-decoration:none;text-overflow:ellipsis;white-space:nowrap;font-size:18px;font-weight:850;letter-spacing:-1px}li a:hover{color:#315eaa;text-decoration:underline}
    .remove{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:#c0c5cc;font-size:22px;opacity:0}li:hover .remove,.remove:focus{opacity:1}.remove:hover{background:#ef5350;color:white}
    .empty{grid-column:1/-1;padding:70px;text-align:center;color:#888}.source{margin:16px 0 0;color:#aaa;text-align:center;font-size:11px}
    @media(max-width:1450px){main{grid-template-columns:repeat(2,minmax(300px,1fr));max-width:1100px}}@media(max-width:700px){header{min-height:190px}main{grid-template-columns:1fr;padding:0 14px 40px}.card{padding:34px 25px}h2{font-size:23px;white-space:normal}.remove{opacity:1}}
  </style>
</head>
<body>
  <header>
    <h1>실시간 인기 검색어</h1>
    <div class="actions">
      <button id="refresh">↻ 새로고침</button>
      <select id="limit"><option value="20">20개</option><option value="30" selected>30개</option><option value="40">40개</option><option value="50">50개</option></select>
    </div>
  </header>
  <main id="grid"><div class="empty">검색어를 불러오는 중입니다.</div></main>
  <script>
    const META={
      daum:{title:"다음 실시간 검색어",mark:"D"},
      google:{title:"구글 실시간 검색어",mark:"G"},
      naver:{title:"크리에이터 어드바이저 검색어",mark:"C"},
      signal:{title:"Signal.bz 실시간 검색어",mark:"S"}
    };
    const grid=document.getElementById("grid");
    const escapeHtml=value=>{const node=document.createElement("span");node.textContent=value;return node.innerHTML};
    const date=value=>new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(value));

    async function load(){
      const refresh=document.getElementById("refresh");refresh.disabled=true;refresh.textContent="업데이트 중";
      try{
        const response=await fetch(`/api/trends?limit=${document.getElementById("limit").value}`,{cache:"no-store"});
        if(!response.ok)throw new Error();
        const data=await response.json();render(data.portals,data.updatedAt);
      }catch{
        grid.innerHTML='<div class="empty">수집된 키워드를 불러오고 있습니다.</div>';
      }finally{refresh.disabled=false;refresh.textContent="↻ 새로고침"}
    }

    function render(portals,updatedAt){
      grid.innerHTML=portals.map(portal=>`<section class="card" data-portal="${portal.id}">
        <div class="card-head"><span class="logo">${META[portal.id].mark}</span><h2>${META[portal.id].title}</h2></div>
        <p class="date">${date(updatedAt)} 기준</p>
        <ol>${portal.items.slice(0,10).map((item,index)=>`<li><span class="rank">${index+1}</span><a href="${item.link}" target="_blank" rel="noreferrer">${escapeHtml(item.keyword)}</a><button class="remove" data-id="${item.id}" aria-label="${escapeHtml(item.keyword)} 삭제">×</button></li>`).join("")}</ol>
        <p class="source">${escapeHtml(portal.source)}</p>
      </section>`).join("");
    }

    grid.addEventListener("click",async event=>{
      const button=event.target.closest(".remove");if(!button)return;
      button.disabled=true;
      const response=await fetch("/api/trends",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:Number(button.dataset.id)})});
      if(response.ok)button.closest("li").remove();else button.disabled=false;
    });
    document.getElementById("refresh").onclick=load;
    document.getElementById("limit").onchange=load;
    load();
    setInterval(load,60*60*1000);
  </script>
</body>
</html>
